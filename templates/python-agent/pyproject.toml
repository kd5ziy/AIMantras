[project]
name = "mantras-agent-template"
version = "0.1.0"
description = "Reference template: run any AI Mantras persona as a standalone agent"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "adapters", "persona"]
